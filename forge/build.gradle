plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}

legacyForge {
    enable {
        forgeVersion = "${minecraft_version}-${forge_version}"
        obfuscateJar = false
    }

    validateAccessTransformers = true

    def at = findProject(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = [at]
    }
    runs {
        client {
            client()
            systemProperties.set(['mixin.env.remapRefMap': 'false'])
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
            systemProperties.set(['mixin.env.remapRefMap': 'false'])
        }
        server {
            server()
            systemProperties.set(['mixin.env.remapRefMap': 'false'])
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }

    mixin {
        config "yet_another_thirst.mixins.json"
    }
}

tasks.named('createMinecraftArtifacts') {
    additionalResults.empty()
}

configurations.named('modDevRuntimeDependencies') {
    dependencies.removeIf { dep ->
        if (dep instanceof FileCollectionDependency) {
            try {
                dep.files.files
                return false
            } catch (Exception e) {
                return true
            }
        }
        return false
    }
}

dependencies.components.withModule('net.minecraftforge:forge') {
    withVariant('modDevApiElements') {
        withCapabilities {
            removeCapability('net.minecraftforge', 'forge')
        }
    }
}

def forgeExcludes = [
        'dev/minhnh/yetanotherthirst/core/block/**',
        'dev/minhnh/yetanotherthirst/screen/**',
        'dev/minhnh/yetanotherthirst/client/WaterBoilerScreen.java',
        'dev/minhnh/yetanotherthirst/client/WaterBoilerRenderer.java',
        'dev/minhnh/yetanotherthirst/compat/JadeCompatPlugin.java',
        'dev/minhnh/yetanotherthirst/compat/ThirstElement.java',
        'dev/minhnh/yetanotherthirst/compat/FluidPurityHelper.java',
        'dev/minhnh/yetanotherthirst/compat/ie/**',
        'dev/minhnh/yetanotherthirst/mixin/create/**',
        'dev/minhnh/yetanotherthirst/mixin/ie/**',
        'dev/minhnh/yetanotherthirst/mixin/CompatMixinPlugin.java',
        'dev/minhnh/yetanotherthirst/mixin/MixinAbstractFurnaceEntity.java',
        'dev/minhnh/yetanotherthirst/mixin/MixinFluidBucketWrapper.java',
        'dev/minhnh/yetanotherthirst/mixin/MixinFluidTank.java',
        'dev/minhnh/yetanotherthirst/mixin/MixinFluidView.java'
]

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
        java {
            exclude forgeExcludes
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    exclude forgeExcludes
}

tasks.named('javadoc', Javadoc) {
    failOnError = false
    exclude forgeExcludes
}

tasks.named('sourcesJar', Jar) {
    exclude forgeExcludes
}

def createClientExtra = tasks.register('createClientExtra', Jar) {
    archiveFileName = 'client-extra.jar'
    destinationDirectory = layout.buildDirectory
    from(zipTree(file("${System.getProperty('user.home')}/.gradle/caches/neoformruntime/artifacts/minecraft_${minecraft_version}_client.jar"))) {
        include 'assets/**'
        include 'data/**'
    }
}

dependencies {
    compileOnly project(":common")
    runtimeOnly files(createClientExtra)
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('classes') {
    doLast {
        copy {
            from sourceSets.main.output.classesDirs
            into sourceSets.main.output.resourcesDir
        }
    }
}

tasks.matching { it.name in ['runServer', 'runClient', 'runData'] }.configureEach {
    classpathProvider.setFrom(classpathProvider.filter { file ->
        !file.absolutePath.contains("/forge/build/classes/")
    })
}

