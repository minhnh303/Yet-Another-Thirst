plugins {
    id 'java-library'
    id 'maven-publish'
}

version = providers.gradleProperty('mod_version').get()

base {
    archivesName = "YetAnotherThirst"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}

// Keep line numbers and source file names for crash stack traces; drop local variable tables to shrink class files.
tasks.withType(JavaCompile).configureEach {
    options.debugOptions.debugLevel = 'lines,source'
}

repositories {
    exclusiveContent {
        forRepository {
            maven {
                name = 'Minecraft Libraries'
                url = 'https://libraries.minecraft.net'
                metadataSources {
                    artifact()
                }
            }
        }
        filter { includeGroup('org.lwjgl') }
    }
    mavenCentral()
    // https://docs.gradle.org/current/userguide/declaring_repositories.html#declaring_content_exclusively_found_in_one_repository
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
    exclusiveContent {
        forRepositories(
                maven {
                    name = 'ParchmentMC'
                    url = 'https://maven.parchmentmc.org/'
                },
                maven {
                    name = "NeoForge"
                    url = 'https://maven.neoforged.net/releases'
                }
        )
        filter { includeGroup('org.parchmentmc.data') }
    }
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        name = 'RyanLiptak'
        url = 'https://maven.ryanliptak.com'
    }
}

// Declare capabilities on the outgoing configurations.
// Read more about capabilities here: https://docs.gradle.org/current/userguide/component_capabilities.html#sec:declaring-additional-capabilities-for-a-local-component
['apiElements', 'runtimeElements', 'sourcesElements'].each { variant ->
    configurations."$variant".outgoing {
        capability("$group:${project.name}:$version")
        capability("$group:${base.archivesName.get()}:$version")
        capability("$group:$mod_id-${project.name}-${minecraft_version}:$version")
        capability("$group:$mod_id:$version")
    }
    publishing.publications.configureEach {
        suppressPomMetadataWarningsFor(variant)
    }
}

sourcesJar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version,
                'MixinConfigs'          : "${mod_id}.mixins.json"
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            "forge_version"                : forge_version,
            "forge_loader_version_range"   : forge_loader_version_range,
            "neoforge_version"             : neoforge_version,
            "neoforge_version_range"       : neoforge_version_range,
            "neoforge_loader_version_range": neoforge_loader_version_range,
            "neoform_version"              : neoform_version,
            "jade_version"                 : jade_version,
            'credits'                      : credits,
            'java_version'                 : java_version,
            'fabric_minecraft_version_range': fabric_minecraft_version_range,
            'fabric_loader_version'        : fabric_loader_version,
            'fabric_api_version'           : fabric_api_version,
            'jade_fabric_version'          : jade_fabric_version,
            'modmenu_version'              : modmenu_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace("\n", "\\\\n") : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', '*.mixins.json', 'fabric.mod.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

configurations {
    testCompileClasspath.extendsFrom(compileClasspath)
    testRuntimeClasspath.extendsFrom(runtimeClasspath)
}

test {
    useJUnitPlatform()
}

// ── Architectural Seam Checks ──────────────────────────────────────────────
if (project.name == 'common') {
    def commonSrcDir = file('src/main/java')
    def commonClientSrcDir = file('src/client/java')

    def checkLoaderSeam = tasks.register('checkLoaderSeam') {
        description = 'Verifies that common code does not import loader-specific APIs (Forge, NeoForge, Fabric).'
        group = 'verification'
        inputs.dir(commonSrcDir)
        if (commonClientSrcDir.exists()) {
            inputs.dir(commonClientSrcDir)
        }

        doLast {
            def forbiddenPrefixes = [
                    'net.minecraftforge.',
                    'net.neoforged.',
                    'net.fabricmc.'
            ]
            def violations = []
            def checkDirs = [commonSrcDir]
            if (commonClientSrcDir.exists()) {
                checkDirs << commonClientSrcDir
            }

            checkDirs.each { dir ->
                fileTree(dir).matching {
                    include '**/*.java'
                }.each { File file ->
                    def relativePath = dir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                    file.eachLine('UTF-8') { line, lineNum ->
                        def trimmed = line.trim()
                        if (trimmed.startsWith('//') || trimmed.startsWith('*') || trimmed.startsWith('/*')) {
                            return
                        }
                        for (prefix in forbiddenPrefixes) {
                            if (trimmed.contains(prefix)) {
                                violations << "[$relativePath:$lineNum] Loader API forbidden in common: $trimmed"
                            }
                        }
                    }
                }
            }

            if (!violations.isEmpty()) {
                throw new GradleException("checkLoaderSeam failed with ${violations.size()} violation(s):\n" + violations.join('\n'))
            }
        }
    }

    def checkClientSeam = tasks.register('checkClientSeam') {
        description = 'Verifies that main common code does not import client-only packages.'
        group = 'verification'
        inputs.dir(commonSrcDir)

        doLast {
            def forbiddenPrefixes = [
                    'net.minecraft.client.',
                    'com.mojang.blaze3d.'
            ]
            def violations = []

            fileTree(commonSrcDir).matching {
                include '**/*.java'
            }.each { File file ->
                def relativePath = commonSrcDir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                file.eachLine('UTF-8') { line, lineNum ->
                    def trimmed = line.trim()
                    if (trimmed.startsWith('//') || trimmed.startsWith('*') || trimmed.startsWith('/*')) {
                        return
                    }
                    for (prefix in forbiddenPrefixes) {
                        if (trimmed.contains(prefix)) {
                            violations << "[$relativePath:$lineNum] Client API forbidden in server-safe common main code: $trimmed"
                        }
                    }
                }
            }

            if (!violations.isEmpty()) {
                throw new GradleException("checkClientSeam failed with ${violations.size()} violation(s):\n" + violations.join('\n'))
            }
        }
    }

    def checkOptionalModSeam = tasks.register('checkOptionalModSeam') {
        description = 'Verifies that non-compat common code does not import optional third-party mod APIs.'
        group = 'verification'
        inputs.dir(commonSrcDir)
        if (commonClientSrcDir.exists()) {
            inputs.dir(commonClientSrcDir)
        }

        doLast {
            def forbiddenPrefixes = [
                    'com.simibubi.create.',
                    'blusunrize.immersiveengineering.',
                    'snownee.jade.',
                    'squeek.appleskin.',
                    'com.momosoftworks.coldsweat.',
                    'de.teamlapen.vampirism.',
                    'vectorwing.farmersdelight.'
            ]
            def violations = []
            def checkDirs = [commonSrcDir]
            if (commonClientSrcDir.exists()) {
                checkDirs << commonClientSrcDir
            }

            checkDirs.each { dir ->
                fileTree(dir).matching {
                    include '**/*.java'
                    exclude '**/compat/**'
                }.each { File file ->
                    def relativePath = dir.toPath().relativize(file.toPath()).toString().replace('\\', '/')
                    file.eachLine('UTF-8') { line, lineNum ->
                        def trimmed = line.trim()
                        if (trimmed.startsWith('//') || trimmed.startsWith('*') || trimmed.startsWith('/*')) {
                            return
                        }
                        for (prefix in forbiddenPrefixes) {
                            if (trimmed.contains(prefix)) {
                                violations << "[$relativePath:$lineNum] Optional mod API forbidden outside compat package: $trimmed"
                            }
                        }
                    }
                }
            }

            if (!violations.isEmpty()) {
                throw new GradleException("checkOptionalModSeam failed with ${violations.size()} violation(s):\n" + violations.join('\n'))
            }
        }
    }

    def checkSeams = tasks.register('checkSeams') {
        description = 'Verifies architectural boundary seams in common code.'
        group = 'verification'
        dependsOn checkLoaderSeam, checkClientSeam, checkOptionalModSeam
    }

    tasks.named('check').configure {
        dependsOn checkSeams
    }

    tasks.named('compileJava').configure {
        dependsOn checkSeams
    }
}

// ── Clean Old Jars & Copy Built Jar to Game Mods Directory ─────────────────
if (project.name in ['forge', 'neoforge', 'fabric']) {
    def resolveModsDir = {
        def loaderKey = "${project.name}ModsDir"
        def propValue = project.findProperty(loaderKey)?.toString()?.trim()
        if (propValue) {
            return propValue
        }
        def genericProp = project.findProperty('modsDir')?.toString()?.trim()
        if (genericProp) {
            return genericProp
        }
        def localPropsFile = rootProject.file('local.properties')
        if (localPropsFile.exists()) {
            def props = new Properties()
            localPropsFile.withInputStream { props.load(it) }
            def localLoaderVal = props.getProperty(loaderKey)?.trim()
            if (localLoaderVal) {
                return localLoaderVal
            }
            def localGenericVal = props.getProperty('modsDir')?.trim()
            if (localGenericVal) {
                return localGenericVal
            }
        }
        return null
    }

    def cleanOldJars = tasks.register('cleanOldJars') {
        description = 'Deletes old jar files from build/libs before building new jars.'
        group = 'build'
        doLast {
            delete fileTree(dir: layout.buildDirectory.dir('libs'), include: '*.jar')
        }
    }

    tasks.withType(Jar).configureEach {
        dependsOn cleanOldJars
    }

    def copyModToGame = tasks.register('copyModToGame') {
        description = 'Removes old mod jars from the target game mods directory and copies the newly built jar.'
        group = 'build'

        onlyIf {
            resolveModsDir() != null
        }

        doLast {
            def rawDir = resolveModsDir()
            if (rawDir == null) {
                return
            }
            if (rawDir.startsWith('~/') || rawDir == '~') {
                rawDir = System.getProperty('user.home') + rawDir.substring(1)
            }
            def targetDir = file(rawDir)
            if (!targetDir.exists() || !targetDir.isDirectory()) {
                throw new GradleException("Target mods directory does not exist: ${targetDir.absolutePath}")
            }

            delete fileTree(dir: targetDir, include: 'YetAnotherThirst-*.jar')

            def jarTask = project.name == 'fabric'
                    ? tasks.named('remapJar').get()
                    : tasks.named('jar').get()
            def jarFile = jarTask.archiveFile.get().asFile

            copy {
                from jarFile
                into targetDir
            }
            logger.lifecycle("Copied ${jarFile.name} -> ${targetDir.absolutePath}")
        }
    }

    if (project.name == 'fabric') {
        pluginManager.withPlugin('fabric-loom') {
            tasks.named('remapJar').configure {
                dependsOn cleanOldJars
            }
            copyModToGame.configure {
                dependsOn tasks.named('remapJar')
            }
        }
    } else {
        copyModToGame.configure {
            dependsOn tasks.named('jar')
        }
    }

    tasks.named('build').configure {
        dependsOn copyModToGame
    }
}
