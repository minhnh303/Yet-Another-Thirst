plugins {
    id 'multiloader-common'
}

base {
    archivesName = "${base.archivesName.get()}-${project.name}"
}

configurations {
    testCompileClasspath.extendsFrom(compileClasspath)
    testRuntimeClasspath.extendsFrom(runtimeClasspath)
    commonJava {
        canBeResolved = true
    }
    commonClientJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

dependencies {
    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonClientJava project(path: ':common', configuration: 'commonClientJava')
    commonResources project(path: ':common', configuration: 'commonResources')
    compileOnly files(project(':common').file('src/main/resources'))
    annotationProcessor files(project(':common').file('src/main/resources'))

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('javadoc', Javadoc).configure {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}
