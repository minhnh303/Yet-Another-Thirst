plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neoform_version
    addModdingDependenciesTo(sourceSets.main)
    if (file("src/main/resources/META-INF/accesstransformer.cfg").exists()) {
        accessTransformers = ["src/main/resources/META-INF/accesstransformer.cfg"]
    }
}

dependencies {
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    compileOnly 'org.spongepowered:mixin:0.8.5'
}

sourceSets {
    main {
        java {
            exclude 'dev/minhnh/yetanotherthirst/compat/JadeCompatPlugin.java'
            exclude 'dev/minhnh/yetanotherthirst/compat/ThirstElement.java'
            exclude 'dev/minhnh/yetanotherthirst/screen/AbstractWaterBoilerMenu.java'
            exclude 'dev/minhnh/yetanotherthirst/screen/WaterBoilerScreen.java'
            exclude 'dev/minhnh/yetanotherthirst/client/WaterBoilerRenderer.java'
            exclude 'dev/minhnh/yetanotherthirst/core/block/IWaterBoiler.java'
        }
    }
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    commonResources sourceSets.main.resources.sourceDirectories.singleFile
}
