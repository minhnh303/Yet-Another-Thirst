plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    validateAccessTransformers = true

    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from at
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources.srcDir 'src/generated/resources'

repositories {
    maven {
        name = "Create"
        url = "https://maven.createmod.net"
    }
}

dependencies {
    compileOnly project(":common")
    compileOnly("maven.modrinth:jade:${jade_version}") {
        transitive = false
    }
    compileOnly("com.simibubi.create:create-1.21.1:6.0.4-50:slim") {
        transitive = false
    }
    compileOnly(files(System.getProperty("user.home") + "/Library/Application Support/minecraft/Instances/NeoForge 1.21.1/mods/ImmersiveEngineering-1.21.1-12.4.2-194.jar"))
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
