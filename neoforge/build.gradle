plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    validateAccessTransformers = true

    def at = findProject(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers = [at]
    }
    runs {
        client {
            client()
        }
        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

def neoForgeExcludes = [
        'dev/minhnh/yetanotherthirst/core/block/**',
        'dev/minhnh/yetanotherthirst/screen/**',
        'dev/minhnh/yetanotherthirst/client/WaterBoilerRenderer.java',
        'dev/minhnh/yetanotherthirst/compat/JadeCompatPlugin.java',
        'dev/minhnh/yetanotherthirst/compat/ThirstElement.java',
        'dev/minhnh/yetanotherthirst/compat/FluidPurityHelper.java',
        'dev/minhnh/yetanotherthirst/compat/ie/**',
        'dev/minhnh/yetanotherthirst/mixin/create/**',
        'dev/minhnh/yetanotherthirst/mixin/ie/**',
        'dev/minhnh/yetanotherthirst/mixin/CompatMixinPlugin.java',
        'dev/minhnh/yetanotherthirst/mixin/MixinAbstractFurnaceEntity.java',
        'dev/minhnh/yetanotherthirst/mixin/MixinFluidBucketWrapper.java',
        'dev/minhnh/yetanotherthirst/mixin/MixinFluidTank.java',
        'dev/minhnh/yetanotherthirst/mixin/MixinFluidView.java'
]

sourceSets {
    main {
        resources.srcDir 'src/generated/resources'
        java {
            exclude neoForgeExcludes
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    exclude neoForgeExcludes
}

tasks.named('javadoc', Javadoc) {
    failOnError = false
    exclude neoForgeExcludes
}

tasks.named('sourcesJar', Jar) {
    exclude neoForgeExcludes
}

dependencies {
    compileOnly project(":common")
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
