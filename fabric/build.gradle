plugins {
    id 'multiloader-common'
    id 'net.fabricmc.fabric-loom' version '1.19.3'
}

base {
    archivesName = "${base.archivesName.get()}-fabric"
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonClientJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
        gametest {
            server()
            name "Game Test"
            vmArg "-Dfabric-api.gametest"
            vmArg "-Dfabric-api.gametest.report-path=${project.layout.buildDirectory.get()}/gametest-results.xml"
            runDir "run-gametest"
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonClientJava project(path: ':common', configuration: 'commonClientJava')
    commonResources project(path: ':common', configuration: 'commonResources')
    compileOnly files(findProject(':common').file('src/main/resources'))
    annotationProcessor files(findProject(':common').file('src/main/resources'))

    // Jade and AppleSkin API stubs — same JARs used by :common for compilation
    compileOnly 'maven.modrinth:jade:11.13.2+forge'
    compileOnly 'squeek.appleskin:appleskin-forge:mc1.20.1-2.5.1:api'
    // modCompileOnly 'maven.modrinth:create-fabric:6.0.8.1+build.1744-mc1.20.1'

    // javax.annotation (@Nonnull etc.) — provided transitively by Forge, must be explicit for Loom
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

sourceSets {
    main {
        java {
            exclude 'dev/minhnh/yetanotherthirst/mixin/create/**'
            exclude 'dev/minhnh/yetanotherthirst/mixin/CompatMixinPlugin.java'
            exclude 'dev/minhnh/yetanotherthirst/mixin/MixinSimpleCookingSerializer.java'
            exclude 'dev/minhnh/yetanotherthirst/mixin/MixinRecipeManager.java'
            exclude 'dev/minhnh/yetanotherthirst/mixin/MixinAbstractFurnaceEntity.java'
        }
    }
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
    exclude 'dev/minhnh/yetanotherthirst/compat/JadeCompatPlugin.java'
    exclude 'dev/minhnh/yetanotherthirst/compat/ThirstElement.java'
    exclude 'dev/minhnh/yetanotherthirst/screen/AbstractWaterBoilerMenu.java'
    exclude 'dev/minhnh/yetanotherthirst/client/WaterBoilerScreen.java'
    exclude 'dev/minhnh/yetanotherthirst/client/WaterBoilerRenderer.java'
    exclude 'dev/minhnh/yetanotherthirst/core/block/IWaterBoiler.java'
    exclude 'dev/minhnh/yetanotherthirst/mixin/create/**'
    exclude 'dev/minhnh/yetanotherthirst/mixin/CompatMixinPlugin.java'
    exclude 'dev/minhnh/yetanotherthirst/mixin/MixinSimpleCookingSerializer.java'
    exclude 'dev/minhnh/yetanotherthirst/mixin/MixinRecipeManager.java'
    exclude 'dev/minhnh/yetanotherthirst/mixin/MixinAbstractFurnaceEntity.java'
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava) {
        exclude 'dev/minhnh/yetanotherthirst/screen/AbstractWaterBoilerMenu.java'
        exclude 'dev/minhnh/yetanotherthirst/core/block/IWaterBoiler.java'
    }
    dependsOn(configurations.commonClientJava)
    from(configurations.commonClientJava) {
        exclude 'dev/minhnh/yetanotherthirst/compat/JadeCompatPlugin.java'
        exclude 'dev/minhnh/yetanotherthirst/compat/ThirstElement.java'
        exclude 'dev/minhnh/yetanotherthirst/client/WaterBoilerScreen.java'
        exclude 'dev/minhnh/yetanotherthirst/client/WaterBoilerRenderer.java'
    }
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
