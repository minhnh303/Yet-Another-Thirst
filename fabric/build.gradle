plugins {
    id 'multiloader-common'
    id 'fabric-loom' version '1.8.9'
}

base {
    archivesName = "${base.archivesName.get()}-fabric"
}

configurations {
    commonJava {
        canBeResolved = true
    }
    commonResources {
        canBeResolved = true
    }
}

loom {
    runs {
        client {
            client()
        }
        server {
            server()
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    mixin {
        add sourceSets.main, "yet_another_thirst.refmap.json"
        useLegacyMixinAp = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"

    compileOnly(project(':common')) {
        capabilities {
            requireCapability "$group:$mod_id"
        }
    }
    commonJava project(path: ':common', configuration: 'commonJava')
    commonResources project(path: ':common', configuration: 'commonResources')
    compileOnly files(project(':common').file('src/main/resources'))
    annotationProcessor files(project(':common').file('src/main/resources'))

    // Jade and AppleSkin API stubs — same JARs used by :common for compilation
    compileOnly 'maven.modrinth:jade:11.13.2+forge'
    compileOnly 'squeek.appleskin:appleskin-forge:mc1.20.1-2.5.1:api'
    modCompileOnly 'maven.modrinth:create-fabric:6.0.8.1+build.1744-mc1.20.1'

    // javax.annotation (@Nonnull etc.) — provided transitively by Forge, must be explicit for Loom
    compileOnly 'com.google.code.findbugs:jsr305:3.0.2'
}

tasks.named('compileJava', JavaCompile) {
    dependsOn(configurations.commonJava)
    source(configurations.commonJava)
}

processResources {
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

tasks.named('sourcesJar', Jar) {
    dependsOn(configurations.commonJava)
    from(configurations.commonJava)
    dependsOn(configurations.commonResources)
    from(configurations.commonResources)
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
